# ---- Stage 1: build the React/Vite frontend ----
FROM node:20-slim AS frontend-build

WORKDIR /frontend
COPY frontend/package*.json ./
RUN npm install
COPY frontend/ ./
RUN npm run build

# ---- Stage 2: backend + serve everything from one process ----
FROM python:3.11-slim

# ffmpeg: converts downloaded audio to wav/mp3
# curl/unzip: required by the deno install script
RUN apt-get update && apt-get install -y --no-install-recommends \
    ffmpeg \
    curl \
    unzip \
    && rm -rf /var/lib/apt/lists/*

# deno: used by yt-dlp's JS runtime for YouTube extraction
RUN curl -fsSL https://deno.land/install.sh | sh

WORKDIR /app

COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

COPY . .
COPY --from=frontend-build /frontend/dist ./frontend/dist

# Local storage for processed audio files and metrics; both are ephemeral
# unless you attach a persistent volume at /audio in Coolify.
RUN mkdir -p /audio /var/log/metrics

EXPOSE 3000

CMD ["gunicorn", "-w", "4", "--timeout", "240", "--bind", "0.0.0.0:3000", "app:app"]
