FROM python:3.11-slim

# ffmpeg: used to convert downloaded audio to wav/mp3
# curl/unzip: required by the deno install script
RUN apt-get update && apt-get install -y --no-install-recommends \
    ffmpeg \
    curl \
    unzip \
    && rm -rf /var/lib/apt/lists/*

# deno: used by yt-dlp's JS runtime for YouTube extraction (YtdlpHandler.py
# hardcodes the path /root/.deno/bin/deno, which matches this install as root)
RUN curl -fsSL https://deno.land/install.sh | sh

WORKDIR /opt/app

COPY requirements.txt ./
RUN pip install --no-cache-dir -r requirements.txt

COPY app ./

EXPOSE 8000

CMD ["gunicorn", "-w", "4", "--timeout", "240", "-b", "0.0.0.0:8000", "wsgi:app"]
